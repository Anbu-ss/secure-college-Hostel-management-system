# render.yaml — Render deployment configuration
# Docs: https://render.com/docs/yaml-spec

services:
  - type: web
    name: secure-hostel-backend
    runtime: node
    rootDir: .
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      # PORT is set automatically by Render — do NOT set it here
      # Set these in the Render dashboard (Environment tab):
      # JWT_SECRET
      # GOOGLE_CLIENT_ID
      # FIREBASE_PROJECT_ID
      # FIREBASE_PRIVATE_KEY_ID
      # FIREBASE_PRIVATE_KEY
      # FIREBASE_CLIENT_EMAIL
      # FIREBASE_CLIENT_ID
      # FIREBASE_CLIENT_CERT_URL
      # FRONTEND_URL  ← your Vercel frontend URL (for CORS)
      # DB_PATH       ← absolute path on Render disk (e.g., /var/data/database.sqlite)
